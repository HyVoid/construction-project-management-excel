name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Cache setup is explicitly disabled to prevent build errors 
          # due to the absence of a committed lockfile.

      - name: Verify Node Version 🔍
        run: node --version

      - name: Install Dependencies & Compile App 🔧
        run: |
          npm install
          npm run build

      - name: Deploy static assets to gh-pages 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          clean: true
